name: "Check Drafts"

# The editor's copy workflow builds and lints, but never runs idnits.
# This job reports nits on every push and pull request.  It does not fail
# the build yet, because the preview build is numbered -latest and idnits
# reports the filename as a nit until the first version is tagged.

on:
  push:
    paths-ignore:
    - README.md
    - CONTRIBUTING.md
    - LICENSE.md
    - .gitignore
  pull_request:
    paths-ignore:
    - README.md
    - CONTRIBUTING.md
    - LICENSE.md
    - .gitignore

jobs:
  idnits:
    name: "Run idnits"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - name: "Checkout"
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        fetch-depth: 0

    - name: "Setup"
      id: setup
      run: date -u "+date=%FT%T" >>"$GITHUB_OUTPUT"

    - name: "Caching"
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
      with:
        path: |
          .refcache
          .venv
          .gems
          node_modules
          .targets.mk
        key: i-d-${{ steps.setup.outputs.date }}
        restore-keys: i-d-

    - name: "Run idnits"
      uses: martinthomson/i-d-template@d2ce969b54014edf5671856b6866866c258bf8f5  # v1
      with:
        make: idnits
        token: ${{ github.token }}
